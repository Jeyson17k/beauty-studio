# Publicación GRATUITA de Beauty Studio en Render (sitio web) con la base de datos en Neon (plan gratuito, sin vencimiento).
# Las fotos y comprobantes se guardan dentro de la base de datos, así que no hace falta disco.
# Las claves se generan en Render y se leen en su panel (Environment); no se guardan en este archivo ni en el repositorio.

services:
  - type: web
    name: beauty-studio
    runtime: node
    plan: free
    region: ohio
    # Instala también las herramientas de compilación, compila, y crea o actualiza las tablas (los datos no se tocan).
    buildCommand: npm ci --include=dev && npm run build && npm run db:crear && npm run db:semilla
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Dirección de conexión de Neon (empieza con postgresql://). Se pega en Render > Environment, nunca en el chat ni en GitHub.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Contraseña inicial del panel (usuario: andrea): se lee en Render > Environment y se cambia desde el panel.
      - key: ADMIN_PASSWORD
        generateValue: true
      # Mientras no haya cuentas reales de correo y de WhatsApp, ambos quedan en modo simulado.
      - key: MAIL_MODE
        value: simulado
      - key: WHATSAPP_MODE
        value: simulado
      # APP_URL (la dirección https pública del sitio) se agrega después de crear el servicio.
